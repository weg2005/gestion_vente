name: Compiler APK Kivy

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer les outils Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake

      - name: Configurer Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"

      - name: Verifier Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "AIDL disponibles :"
          find "$ANDROID_HOME" -name aidl -type f

      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.34"

      - name: Decompresser le projet
        run: |
          mkdir projet
          unzip sql_stock.zip -d projet

      - name: Afficher le projet
        run: |
          find projet -maxdepth 2 -type f

      - name: Creer buildozer.spec
        working-directory: projet
        run: |
          buildozer init

      - name: Configurer Buildozer
        working-directory: projet
        run: |
          sed -i 's/^title = .*/title = Gestion Vente/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = gestionvente/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.gestion/' buildozer.spec

          sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,jpeg,kv,atlas,db,ttf,txt/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy/' buildozer.spec
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec

          echo "android.api = 35" >> buildozer.spec
          echo "android.minapi = 24" >> buildozer.spec
          echo "android.sdk_path = $ANDROID_HOME" >> buildozer.spec

          echo "===== BUILDOZER.SPEC ====="
          cat buildozer.spec

      - name: Preparer le SDK Buildozer
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "===== CREATION DU SDK ====="
          mkdir -p "$SDK"

          echo "===== CREATION DU CHEMIN SDKMANAGER ====="
          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"

          echo "===== VERIFICATION SDKMANAGER ====="
          ls -l "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version

          echo "===== INSTALLATION DES OUTILS ANDROID ====="

          yes | "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses || true

          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          echo "===== VERIFICATION AIDL ====="
          find "$SDK" -name aidl -type f -print

          echo "===== VERIFICATION BUILD TOOLS ====="
          ls -la "$SDK/build-tools/37.0.0"

      - name: Compiler APK
        working-directory: projet
        run: |
          echo "===== DEBUT COMPILATION APK ====="
          buildozer -v android debug

      - name: Chercher APK
        run: |
          echo "===== APK TROUVES ====="
          find . -type f -name "*.apk" -print

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: gestion-vente-apk
          path: '**/*.apk'
          if-no-files-found: error
