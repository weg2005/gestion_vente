name: Compiler APK Kivy
on: workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # <--- PAS 3.14, OBLIGATOIREMENT 3.11

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer outils
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libtool-bin libltdl-dev gettext autopoint pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev

      - name: Configurer Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install Cython==3.0.11
          pip install git+https://github.com/kivy/buildozer.git
          pip install git+https://github.com/kivy/python-for-android.git@develop

      - name: Decompresser
        run: |
          mkdir projet
          unzip sql_stock.zip -d projet

      - name: Creer buildozer.spec
        working-directory: projet
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Gestion Vente
          package.name = gestionvente
          package.domain = org.gestion
          source.dir =.
          source.include_exts = py,png,jpg,kv,atlas,db,ttf,txt,json
          version = 0.1
          requirements = python3,kivy==2.3.1,pillow
          orientation = portrait

          [buildozer]
          log_level = 2

          [app:android]
          android.api = 33
          android.minapi = 24
          android.ndk = 28c
          android.accept_sdk_license = True
          android.archs = arm64-v8a
          p4a.bootstrap = sdl2
          p4a.branch = develop
          EOF
          cat buildozer.spec

      - name: Compiler APK
        working-directory: projet
        run: |
          rm -rf.buildozer bin
          buildozer -v android debug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: gestion-vente-apk
          path: projet/bin/*.apk
