name: Compilateur APK Kivy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. RÉCUPÉRER LE PROJET
      # ============================================================
      - name: Récupérer le projet
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON HÔTE (Python 3.11)
      # ============================================================
      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. JAVA 17
      # ============================================================
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. DÉPENDANCES LINUX
      # ============================================================
      - name: Installer les dépendances Linux
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            gettext \
            autopoint \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            curl


      # ============================================================
      # 5. INSTALLATION INITIALE DES OUTILS
      # ============================================================
      - name: Installer Buildozer et Cython
        run: |
          python -m pip install "pip<24.1" "setuptools<70.0.0" wheel
          pip install buildozer
          pip install "cython<3.1.0"
          pip install legacy-cgi


      # ============================================================
      # 6. DÉCOMPRESSER LE PROJET ET PRÉPARER MAIN.PY
      # ============================================================
      - name: Décompresser le projet et préparer main.py
        run: |
          mkdir -p projet

          unzip -o sql_stock.zip -d projet

          # Suppression des répertoires indésirables
          find projet -name ".buildozer" -type d -exec rm -rf {} +
          find projet -name ".bin" -type d -exec rm -rf {} +

          # Si le ZIP extrait un sous-dossier unique, remonter les fichiers
          if [ $(ls -1 projet | wc -l) -eq 1 ] && [ -d projet/* ]; then
            echo "Déplacement des fichiers depuis le sous-dossier extrait..."
            mv projet/*/* projet/ 2>/dev/null || true
          fi

          # Garantir l'existence de main.py
          cd projet
          if [ ! -f "main.py" ]; then
            ALT_MAIN=$(ls *.py 2>/dev/null | head -n 1)
            if [ -n "$ALT_MAIN" ]; then
              echo "Renommage de $ALT_MAIN en main.py"
              mv "$ALT_MAIN" main.py
            else
              echo "ERREUR: Aucun fichier .py trouvé dans le projet!"
              exit 1
            fi
          fi


      # ============================================================
      # 7. CRÉER BUILDOZER.SPEC
      # ============================================================
      - name: Créer buildozer.spec
        working-directory: projet
        run: |
          buildozer init


      # ============================================================
      # 8. CONFIGURER BUILDOZER
      # ============================================================
      - name: Configurer Buildozer
        working-directory: projet
        run: |

          # Application
          sed -i 's/^title = .*/title = Gestion Vente/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = gestionvente/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.gestion/' buildozer.spec

          # DÉPENDANCES
          sed -i 's/^requirements = .*/requirements = hostpython3==3.11.0,python3==3.11.0,kivy/' buildozer.spec

          # Orientation & Fichiers
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,jpeg,kv,atlas,db,ttf,txt/' buildozer.spec

          # Exclure tous les dossiers de test et de documentation inutiles
          sed -i 's/^# android.exclude_src = .*/android.exclude_src = tests, test, lib2to3\/tests, doc, docs/' buildozer.spec

          # API Android, Build-Tools et NDK
          if grep -q '^android.api =' buildozer.spec; then
            sed -i 's/^android.api = .*/android.api = 33/' buildozer.spec
          else
            echo "android.api = 33" >> buildozer.spec
          fi

          if grep -q '^android.minapi =' buildozer.spec; then
            sed -i 's/^android.minapi = .*/android.minapi = 24/' buildozer.spec
          else
            echo "android.minapi = 24" >> buildozer.spec
          fi

          if grep -q '^android.ndk =' buildozer.spec; then
            sed -i 's/^android.ndk = .*/android.ndk = 25b/' buildozer.spec
          else
            echo "android.ndk = 25b" >> buildozer.spec
          fi

          if grep -q '^android.build_tools_version =' buildozer.spec; then
            sed -i 's/^android.build_tools_version = .*/android.build_tools_version = 33.0.2/' buildozer.spec
          else
            echo "android.build_tools_version = 33.0.2" >> buildozer.spec
          fi

          # Nettoyage p4a
          sed -i '/^p4a.url =/d' buildozer.spec
          sed -i '/^p4a.fork =/d' buildozer.spec
          sed -i '/^p4a.branch =/d' buildozer.spec
          sed -i '/^p4a.commit =/d' buildozer.spec

          # Logs
          if grep -q '^log_level =' buildozer.spec; then
            sed -i 's/^log_level = .*/log_level = 2/' buildozer.spec
          else
            echo "log_level = 2" >> buildozer.spec
          fi


      # ============================================================
      # 9. PRÉPARER LE SDK ANDROID ET LES LICENCES
      # ============================================================
      - name: Configuration du SDK Android
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"
          mkdir -p "$SDK_DIR/tools/bin"
          mkdir -p "$SDK_DIR/licenses"
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          # 1. Commandline tools
          curl -sS -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$SDK_DIR/cmdline-tools"
          mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
          rm cmdline-tools.zip

          # 2. Liens symboliques
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin/avdmanager" "$SDK_DIR/tools/bin/avdmanager"

          # 3. Licences
          LICENSES_CONTENT="\n89330d222637a000b01f7e9f4a3f656c78f4382f\nd56f5187479451eabf01fb78af6dfcb131a6481e\n2433373577d3e887a181e5a4af937d15d0433c50\ncd5010c71487d008b8b70f074d23258832a82390"
          PREVIEW_CONTENT="\n84831b94fe1430d75d55046884d77649db190779"

          echo -e "$LICENSES_CONTENT" > "$SDK_DIR/licenses/android-sdk-license"
          echo -e "$PREVIEW_CONTENT" > "$SDK_DIR/licenses/android-sdk-preview-license"

          # 4. Acceptation globale
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" --licenses || true

          # 5. Pré-installation build-tools
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" "platforms;android-33" "build-tools;33.0.2" "platform-tools"


      # ============================================================
      # 10. COMPILATION APK (PATCH SUR SYSTEM TARFILE)
      # ============================================================
      - name: Compiler APK
        run: |

          mkdir -p /tmp/a
          cp -r projet/* /tmp/a/
          cd /tmp/a

          echo "================================================="
          echo "PATCH CHIRURGICAL DU MODULE TARFILE PYTHON"
          echo "================================================="

          # Neutralisation directe de l'exception "name is too long" dans tarfile.py
          TARFILE_PY=$(python -c "import tarfile; print(tarfile.__file__)")
          sudo sed -i 's/raise ValueError("name is too long")/return self.create_pax_header(info, encoding, errors)/g' "$TARFILE_PY" || true

          # Fichier de contraintes Pip
          echo "pip<24.1" > /tmp/pip_constraints.txt
          echo "setuptools<70.0.0" >> /tmp/pip_constraints.txt

          echo "================================================="
          echo "DÉBUT DE LA COMPILATION APK"
          echo "================================================="

          export PIP_CONSTRAINT="/tmp/pip_constraints.txt"
          export PIP_DISABLE_PIP_VERSION_CHECK="1"
          export ACLOCAL_PATH="/usr/share/aclocal:/usr/share/libtool/m4"
          export LIBTOOLIZE="libtoolize"

          # Compilation dans /tmp/a
          buildozer -v android debug

          # Rapatriement de l'APK généré vers le workspace principal
          mkdir -p $GITHUB_WORKSPACE/projet/bin
          cp -r bin/*.apk $GITHUB_WORKSPACE/projet/bin/ 2>/dev/null || true


      # ============================================================
      # 11. RÉCUPÉRER L'APK
      # ============================================================
      - name: Récupérer APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gestion-vente-apk
          path: projet/bin/*.apk
          if-no-files-found: error
