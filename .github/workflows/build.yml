name: Compilateur APK Kivy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. RÉCUPÉRER LE PROJET
      # ============================================================
      - name: Récupérer le projet
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON HÔTE
      # ============================================================
      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"


      # ============================================================
      # 3. JAVA
      # ============================================================
      - name: Installer Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. DÉPENDANCES LINUX
      # ============================================================
      - name: Installer les dépendances Linux
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            gettext \
            autopoint \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # ============================================================
      # 5. INSTALLER BUILDOZER
      # ============================================================
      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip

          pip install git+https://github.com/kivy/buildozer.git

          pip install legacy-cgi

          pip install "cython==0.29.34"

          buildozer --version


      # ============================================================
      # 6. DÉCOMPRESSER LE PROJET
      # ============================================================
      - name: Décompresser le projet
        run: |
          mkdir -p projet

          unzip -o sql_stock.zip -d projet


      # ============================================================
      # 7. CRÉER BUILDOZER.SPEC
      # ============================================================
      - name: Créer buildozer.spec
        working-directory: projet
        run: |
          buildozer init


      # ============================================================
      # 8. CONFIGURER BUILDOZER
      # ============================================================
      - name: Configurer Buildozer
        working-directory: projet
        run: |

          # --------------------------------------------------------
          # APPLICATION
          # --------------------------------------------------------
          sed -i 's/^title = .*/title = Gestion Vente/' buildozer.spec

          sed -i 's/^package.name = .*/package.name = gestionvente/' buildozer.spec

          sed -i 's/^package.domain = .*/package.domain = org.gestion/' buildozer.spec


          # --------------------------------------------------------
          # DÉPENDANCES
          # --------------------------------------------------------
          # Pour cette première compilation :
          # uniquement Python + Kivy.
          #
          # NE PAS ajouter charset-normalizer ici.
          # NE PAS ajouter matplotlib/pandas pour l'instant.
          # --------------------------------------------------------
          sed -i 's/^requirements = .*/requirements = python3,kivy/' buildozer.spec


          # --------------------------------------------------------
          # ORIENTATION
          # --------------------------------------------------------
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec


          # --------------------------------------------------------
          # FICHIERS À INCLURE
          # --------------------------------------------------------
          sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,jpeg,kv,atlas,db,ttf,txt/' buildozer.spec


          # ========================================================
          # API ANDROID
          # ========================================================
          if grep -q '^android.api =' buildozer.spec; then
            sed -i 's/^android.api = .*/android.api = 35/' buildozer.spec
          else
            echo "android.api = 35" >> buildozer.spec
          fi


          # ========================================================
          # API MINIMALE
          # ========================================================
          if grep -q '^android.minapi =' buildozer.spec; then
            sed -i 's/^android.minapi = .*/android.minapi = 24/' buildozer.spec
          else
            echo "android.minapi = 24" >> buildozer.spec
          fi


          # ========================================================
          # NDK
          # ========================================================
          if grep -q '^android.ndk =' buildozer.spec; then
            sed -i 's/^android.ndk = .*/android.ndk = 28c/' buildozer.spec
          else
            echo "android.ndk = 28c" >> buildozer.spec
          fi


          # ========================================================
          # IMPORTANT :
          # NE PAS FORCER P4A SUR DEVELOP
          # ========================================================
          sed -i '/^p4a.branch =/d' buildozer.spec

          sed -i '/^p4a.commit =/d' buildozer.spec


          # ========================================================
          # NIVEAU DE LOG
          # ========================================================
          if grep -q '^log_level =' buildozer.spec; then
            sed -i 's/^log_level = .*/log_level = 2/' buildozer.spec
          else
            echo "log_level = 2" >> buildozer.spec
          fi


      # ============================================================
      # 9. VÉRIFIER LA CONFIGURATION
      # ============================================================
      - name: Vérifier la configuration
        working-directory: projet
        run: |

          echo "================================================="
          echo "CONFIGURATION BUILDOZER"
          echo "================================================="

          grep -nE \
            "title|package.name|package.domain|requirements|orientation|source.include_exts|android.api|android.minapi|android.ndk|p4a.branch|p4a.commit|log_level" \
            buildozer.spec

          echo "================================================="
          echo "VERSION PYTHON"
          echo "================================================="

          python --version

          echo "================================================="
          echo "VERSION BUILDOZER"
          echo "================================================="

          buildozer --version


      # ============================================================
      # 10. NETTOYAGE COMPLET
      # ============================================================
      - name: Nettoyer les anciens fichiers
        working-directory: projet
        run: |

          rm -rf .buildozer

          rm -rf bin


      # ============================================================
      # 11. PRÉPARER LE SDK ANDROID
      # ============================================================
      - name: Préparer le SDK Android automatiquement
        run: |

          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "================================================="
          echo "PRÉPARATION DU SDK ANDROID"
          echo "================================================="

          mkdir -p "$SDK/tools/bin"


          # --------------------------------------------------------
          # SDKMANAGER
          # --------------------------------------------------------
          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"


          # --------------------------------------------------------
          # AVDMANAGER
          # --------------------------------------------------------
          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"


          SDKMANAGER="$SDK/tools/bin/sdkmanager"


          echo "================================================="
          echo "VERSION SDKMANAGER"
          echo "================================================="

          "$SDKMANAGER" --version


          # ========================================================
          # LICENCES
          # ========================================================
          echo "================================================="
          echo "ACCEPTATION DES LICENCES"
          echo "================================================="

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses || true


          # ========================================================
          # INSTALLATION DES COMPOSANTS
          # ========================================================
          echo "================================================="
          echo "INSTALLATION DES COMPOSANTS ANDROID"
          echo "================================================="

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


          # ========================================================
          # VÉRIFICATION DES LICENCES
          # ========================================================
          echo "================================================="
          echo "VÉRIFICATION DES LICENCES"
          echo "================================================="

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses || true


          echo "================================================="
          echo "SDK ANDROID PRÊT"
          echo "================================================="


      # ============================================================
      # 12. COMPILATION APK
      # ============================================================
      - name: Compiler APK
        working-directory: projet
        env:
          ACLOCAL_PATH: /usr/share/aclocal:/usr/share/libtool/m4
          LIBTOOLIZE: libtoolize
        run: |

          echo "================================================="
          echo "COMPILATION APK"
          echo "================================================="

          buildozer -v android debug


      # ============================================================
      # 13. RECHERCHER L'APK
      # ============================================================
      - name: Chercher APK
        if: always()
        run: |

          echo "================================================="
          echo "APK TROUVÉS"
          echo "================================================="

          find . \
            -type f \
            -name "*.apk" \
            -print


          echo ""

          echo "================================================="
          echo "CONTENU DU DOSSIER BIN"
          echo "================================================="

          ls -lah projet/bin/ || true


      # ============================================================
      # 14. RÉCUPÉRER L'APK
      # ============================================================
      - name: Récupérer APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gestion-vente-apk
          path: projet/bin/*.apk
          if-no-files-found: error
