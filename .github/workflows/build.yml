name: Compiler APK Kivy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1. RECUPERER LE PROJET
      # ==========================================================
      - name: Recuperer le projet
        uses: actions/checkout@v4


      # ==========================================================
      # 2. PYTHON
      # ==========================================================
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"


      # ==========================================================
      # 3. JAVA
      # ==========================================================
      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # 4. OUTILS LINUX
      # ==========================================================
      - name: Installer les outils Linux
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            gettext \
            autopoint \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # ==========================================================
      # 5. OUTILS AUTOTOOLS
      # ==========================================================
      - name: Verifier les outils Autotools
        run: |
          autoconf --version
          automake --version
          libtool --version
          libtoolize --version

          find /usr \
            -name "libtool.m4" \
            -o -name "lt*.m4" \
            2>/dev/null | head -50


      # ==========================================================
      # 6. ANDROID SDK
      # ==========================================================
      - name: Configurer Android SDK
        run: |

          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          yes | \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"


      # ==========================================================
      # 7. VERIFIER SDK
      # ==========================================================
      - name: Verifier Android SDK
        run: |

          echo "===== PLATEFORMES ====="

          find "$ANDROID_HOME/platforms" \
            -maxdepth 1 \
            -type d \
            -print

          echo "===== AIDL ====="

          find "$ANDROID_HOME" \
            -name aidl \
            -type f \
            -print

          echo "===== BUILD TOOLS ====="

          find "$ANDROID_HOME/build-tools" \
            -maxdepth 1 \
            -type d \
            -print


      # ==========================================================
      # 8. BUILDOZER
      # ==========================================================
      - name: Installer Buildozer
        run: |

          python -m pip install --upgrade pip

          pip install \
            git+https://github.com/kivy/buildozer.git

          pip install legacy-cgi

          pip install setuptools

          pip install "cython==0.29.34"

          buildozer --version


      # ==========================================================
      # 9. DECOMPRESSER
      # ==========================================================
      - name: Decompresser le projet
        run: |

          mkdir projet

          unzip sql_stock.zip -d projet


      # ==========================================================
      # 10. BUILDOZER SPEC
      # ==========================================================
      - name: Creer buildozer.spec
        working-directory: projet
        run: |
          buildozer init


      # ==========================================================
      # 11. CONFIGURER BUILDOZER
      # ==========================================================
      - name: Configurer Buildozer
        working-directory: projet
        run: |

          sed -i \
            's/^title = .*/title = Gestion Vente/' \
            buildozer.spec

          sed -i \
            's/^package.name = .*/package.name = gestionvente/' \
            buildozer.spec

          sed -i \
            's/^package.domain = .*/package.domain = org.gestion/' \
            buildozer.spec

          sed -i \
            's/^source.include_exts = .*/source.include_exts = py,png,jpg,jpeg,kv,atlas,db,ttf,txt/' \
            buildozer.spec

          sed -i \
            's/^requirements = .*/requirements = python3,kivy/' \
            buildozer.spec

          sed -i \
            's/^orientation = .*/orientation = portrait/' \
            buildozer.spec


          if grep -q '^android.api =' buildozer.spec; then
            sed -i \
              's/^android.api = .*/android.api = 35/' \
              buildozer.spec
          else
            echo "android.api = 35" >> buildozer.spec
          fi


          if grep -q '^android.minapi =' buildozer.spec; then
            sed -i \
              's/^android.minapi = .*/android.minapi = 24/' \
              buildozer.spec
          else
            echo "android.minapi = 24" >> buildozer.spec
          fi


          if grep -q '^android.sdk_path =' buildozer.spec; then
            sed -i \
              "s|^android.sdk_path = .*|android.sdk_path = $ANDROID_HOME|" \
              buildozer.spec
          else
            echo "android.sdk_path = $ANDROID_HOME" >> buildozer.spec
          fi


          if grep -q '^android.ndk =' buildozer.spec; then
            sed -i \
              's/^android.ndk = .*/android.ndk = 28c/' \
              buildozer.spec
          else
            echo "android.ndk = 28c" >> buildozer.spec
          fi


          if grep -q '^p4a.branch =' buildozer.spec; then
            sed -i \
              's/^p4a.branch = .*/p4a.branch = develop/' \
              buildozer.spec
          else
            echo "p4a.branch = develop" >> buildozer.spec
          fi


          if grep -q '^p4a.commit =' buildozer.spec; then
            sed -i \
              's/^p4a.commit = .*/p4a.commit = d2ee8c5/' \
              buildozer.spec
          else
            echo "p4a.commit = d2ee8c5" >> buildozer.spec
          fi


          if grep -q '^log_level =' buildozer.spec; then
            sed -i \
              's/^log_level = .*/log_level = 2/' \
              buildozer.spec
          else
            echo "log_level = 2" >> buildozer.spec
          fi


      # ==========================================================
      # 12. AFFICHER CONFIGURATION
      # ==========================================================
      - name: Verifier configuration
        working-directory: projet
        run: |

          grep -nE \
            "title|package.name|package.domain|requirements|orientation|android.api|android.minapi|android.ndk|p4a.branch|p4a.commit|android.sdk_path|log_level" \
            buildozer.spec


      # ==========================================================
      # 13. SDK INTERNE BUILDOZER
      # ==========================================================
      - name: Preparer le SDK Buildozer
        run: |

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/tools/bin"


          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"


          "$SDK/tools/bin/sdkmanager" --version


          yes | \
            "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses || true


          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-35" \
            "build-tools;37.0.0"


      # ==========================================================
      # 14. NETTOYAGE
      # ==========================================================
      - name: Nettoyer ancien environnement
        working-directory: projet
        run: |
          rm -rf .buildozer
          rm -rf bin


      # ==========================================================
      # 15. INITIALISER P4A SANS COMPILER
      # ==========================================================
      - name: Initialiser Python-for-Android
        working-directory: projet
        run: |

          echo "=================================================="
          echo "PREPARATION DE PYTHON-FOR-ANDROID"
          echo "=================================================="

          buildozer android debug 2>&1 | \
            tee /tmp/buildozer_initialisation.log \
            || true

          echo ""
          echo "===== FIN INITIALISATION ====="


      # ==========================================================
      # 16. REPARER LE PIP INTERNE
      # ==========================================================
      - name: Reparer le pip interne de P4A
        working-directory: projet
        run: |

          echo "=================================================="
          echo "RECHERCHE DES ENVIRONNEMENTS VIRTUELS P4A"
          echo "=================================================="

          find .buildozer \
            -type f \
            -path "*/bin/pip" \
            -print \
            2>/dev/null || true


          echo ""
          echo "=================================================="
          echo "RECHERCHE DU VENV DE BUILD"
          echo "=================================================="

          VENV=$(find .buildozer \
            -type f \
            -path "*/build/venv/bin/python" \
            -print \
            2>/dev/null \
            | head -1)


          if [ -n "$VENV" ]; then

            echo "Python interne trouve :"
            echo "$VENV"

            VENV_DIR=$(dirname "$VENV")

            echo ""
            echo "Reparation de pip..."

            "$VENV" -m ensurepip --upgrade || true

            "$VENV" -m pip install \
              --upgrade \
              "pip<26" \
              setuptools \
              wheel \
              || true

            echo ""
            echo "Version pip interne :"

            "$VENV" -m pip --version || true

          else

            echo "Aucun venv P4A trouve."

          fi


      # ==========================================================
      # 17. RECHERCHE CHARSET APRES INITIALISATION
      # ==========================================================
      - name: Rechercher charset_normalizer apres initialisation
        working-directory: projet
        run: |

          echo "=========================================================="
          echo " RECHERCHE CHARSET_NORMALIZER APRES INITIALISATION"
          echo "=========================================================="


          P4A="$HOME/.buildozer/android/platform/python-for-android"


          echo ""
          echo "===== 1. PYTHON-FOR-ANDROID ====="

          if [ -d "$P4A" ]; then

            echo "P4A : $P4A"

            grep -RniE \
              "charset[_-]normalizer" \
              "$P4A" \
              2>/dev/null \
              || echo "Aucune reference."

          else

            echo "P4A introuvable."

          fi


          echo ""
          echo "===== 2. RECETTES ====="

          if [ -d "$P4A/pythonforandroid/recipes" ]; then

            grep -RniE \
              "charset[_-]normalizer" \
              "$P4A/pythonforandroid/recipes" \
              2>/dev/null \
              || echo "Aucune reference dans les recettes."

          fi


          echo ""
          echo "===== 3. TOUT .BUILDOZER ====="

          grep -RniE \
            "charset[_-]normalizer" \
            "$HOME/.buildozer" \
            2>/dev/null \
            || echo "Aucune reference dans .buildozer."


          echo ""
          echo "===== 4. WHEELS ====="

          find "$HOME/.buildozer" \
            -type f \
            \( \
              -iname "*charset*" \
              -o -iname "*normalizer*" \
            \) \
            -print \
            2>/dev/null


          echo ""
          echo "===== FIN RECHERCHE ====="


      # ==========================================================
      # 18. COMPILATION FINALE
      # ==========================================================
      - name: Compiler APK
        working-directory: projet
        env:
          ACLOCAL_PATH: /usr/share/aclocal:/usr/share/libtool/m4
          LIBTOOLIZE: libtoolize
        run: |

          echo "=================================================="
          echo "COMPILATION APK"
          echo "=================================================="

          buildozer -v android debug


      # ==========================================================
      # 19. CHERCHER APK
      # ==========================================================
      - name: Chercher APK
        if: always()
        run: |

          echo "===== APK TROUVES ====="

          find . \
            -type f \
            -name "*.apk" \
            -print

          echo ""
          echo "===== BIN ====="

          ls -lah \
            projet/bin/ \
            || true


      # ==========================================================
      # 20. RECUPERER APK
      # ==========================================================
      - name: Recuperer APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gestion-vente-apk
          path: |
            projet/bin/*.apk
          if-no-files-found: error
