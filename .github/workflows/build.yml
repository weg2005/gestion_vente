name: Compiler APK Kivy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1. RECUPERER LE PROJET
      # ==========================================================
      - name: Recuperer le projet
        uses: actions/checkout@v4


      # ==========================================================
      # 2. INSTALLER PYTHON
      # ==========================================================
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"


      # ==========================================================
      # 3. INSTALLER JAVA
      # ==========================================================
      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # 4. OUTILS LINUX
      # ==========================================================
      - name: Installer les outils Linux
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            gettext \
            autopoint \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # ==========================================================
      # 5. VERIFIER AUTOTOOLS
      # ==========================================================
      - name: Verifier les outils Autotools
        run: |
          echo "===== AUTOCONF ====="
          autoconf --version

          echo "===== AUTOMAKE ====="
          automake --version

          echo "===== LIBTOOL ====="
          libtool --version

          echo "===== LIBTOOLIZE ====="
          libtoolize --version

          echo "===== MACROS LIBTOOL ====="
          find /usr \
            -name "libtool.m4" \
            -o -name "lt*.m4" \
            2>/dev/null | head -50


      # ==========================================================
      # 6. CONFIGURER ANDROID SDK
      # ==========================================================
      - name: Configurer Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"


      # ==========================================================
      # 7. VERIFIER ANDROID SDK
      # ==========================================================
      - name: Verifier Android SDK
        run: |
          echo "===== PLATEFORMES ====="

          find "$ANDROID_HOME/platforms" \
            -maxdepth 1 \
            -type d \
            -print

          echo "===== AIDL ====="

          find "$ANDROID_HOME" \
            -name aidl \
            -type f \
            -print

          echo "===== BUILD TOOLS ====="

          find "$ANDROID_HOME/build-tools" \
            -maxdepth 1 \
            -type d \
            -print


      # ==========================================================
      # 8. INSTALLER BUILDOZER
      # ==========================================================
      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip

          pip install git+https://github.com/kivy/buildozer.git

          pip install legacy-cgi

          pip install setuptools

          pip install "cython==0.29.34"

          buildozer --version


      # ==========================================================
      # 9. DECOMPRESSER LE PROJET
      # ==========================================================
      - name: Decompresser le projet
        run: |
          mkdir projet

          unzip sql_stock.zip -d projet


      # ==========================================================
      # 10. AFFICHER LE PROJET
      # ==========================================================
      - name: Afficher le projet
        run: |
          echo "===== FICHIERS DU PROJET ====="

          find projet \
            -maxdepth 2 \
            -type f \
            -print


      # ==========================================================
      # 11. CREER BUILDOZER.SPEC
      # ==========================================================
      - name: Creer buildozer.spec
        working-directory: projet
        run: |
          buildozer init


      # ==========================================================
      # 12. CONFIGURER BUILDOZER
      # ==========================================================
      - name: Configurer Buildozer
        working-directory: projet
        run: |

          sed -i \
            's/^title = .*/title = Gestion Vente/' \
            buildozer.spec

          sed -i \
            's/^package.name = .*/package.name = gestionvente/' \
            buildozer.spec

          sed -i \
            's/^package.domain = .*/package.domain = org.gestion/' \
            buildozer.spec

          sed -i \
            's/^source.include_exts = .*/source.include_exts = py,png,jpg,jpeg,kv,atlas,db,ttf,txt/' \
            buildozer.spec

          sed -i \
            's/^requirements = .*/requirements = python3,kivy/' \
            buildozer.spec

          sed -i \
            's/^orientation = .*/orientation = portrait/' \
            buildozer.spec


          # ------------------------------------------------------
          # API ANDROID
          # ------------------------------------------------------

          if grep -q '^android.api =' buildozer.spec; then
            sed -i \
              's/^android.api = .*/android.api = 35/' \
              buildozer.spec
          else
            echo "android.api = 35" >> buildozer.spec
          fi


          # ------------------------------------------------------
          # MIN API
          # ------------------------------------------------------

          if grep -q '^android.minapi =' buildozer.spec; then
            sed -i \
              's/^android.minapi = .*/android.minapi = 24/' \
              buildozer.spec
          else
            echo "android.minapi = 24" >> buildozer.spec
          fi


          # ------------------------------------------------------
          # SDK PATH
          # ------------------------------------------------------

          if grep -q '^android.sdk_path =' buildozer.spec; then
            sed -i \
              "s|^android.sdk_path = .*|android.sdk_path = $ANDROID_HOME|" \
              buildozer.spec
          else
            echo "android.sdk_path = $ANDROID_HOME" >> buildozer.spec
          fi


          # ------------------------------------------------------
          # NDK
          # ------------------------------------------------------

          if grep -q '^android.ndk =' buildozer.spec; then
            sed -i \
              's/^android.ndk = .*/android.ndk = 28c/' \
              buildozer.spec
          else
            echo "android.ndk = 28c" >> buildozer.spec
          fi


          # ------------------------------------------------------
          # PYTHON-FOR-ANDROID
          # ------------------------------------------------------

          if grep -q '^p4a.branch =' buildozer.spec; then
            sed -i \
              's/^p4a.branch = .*/p4a.branch = develop/' \
              buildozer.spec
          else
            echo "p4a.branch = develop" >> buildozer.spec
          fi


          if grep -q '^p4a.commit =' buildozer.spec; then
            sed -i \
              's/^p4a.commit = .*/p4a.commit = d2ee8c5/' \
              buildozer.spec
          else
            echo "p4a.commit = d2ee8c5" >> buildozer.spec
          fi


          # ------------------------------------------------------
          # LOG
          # ------------------------------------------------------

          if grep -q '^log_level =' buildozer.spec; then
            sed -i \
              's/^log_level = .*/log_level = 2/' \
              buildozer.spec
          else
            echo "log_level = 2" >> buildozer.spec
          fi


      # ==========================================================
      # 13. VERIFIER CONFIGURATION
      # ==========================================================
      - name: Verifier configuration
        working-directory: projet
        run: |
          echo "===== BUILDOZER.SPEC ====="

          grep -nE \
            "title|package.name|package.domain|requirements|orientation|android.api|android.minapi|android.ndk|p4a.branch|p4a.commit|android.sdk_path|log_level" \
            buildozer.spec


      # ==========================================================
      # 14. PREPARER SDK BUILDOZER
      # ==========================================================
      - name: Preparer le SDK Buildozer
        run: |

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK"

          mkdir -p "$SDK/tools/bin"


          # ------------------------------------------------------
          # CREER LES ANCIENS CHEMINS ATTENDUS PAR BUILDOZER
          # ------------------------------------------------------

          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"


          echo "===== SDKMANAGER ====="

          "$SDK/tools/bin/sdkmanager" --version


          echo "===== LICENCES ====="

          yes | \
            "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses || true


          echo "===== INSTALLATION SDK ====="

          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-35" \
            "build-tools;37.0.0"


          echo "===== PLATEFORMES BUILDOZER ====="

          find "$SDK/platforms" \
            -maxdepth 1 \
            -type d \
            -print


          echo "===== BUILD TOOLS BUILDOZER ====="

          find "$SDK/build-tools" \
            -maxdepth 1 \
            -type d \
            -print


      # ==========================================================
      # 15. NETTOYER ANCIEN BUILDOZER
      # ==========================================================
      - name: Nettoyer ancien environnement Buildozer
        working-directory: projet
        run: |
          rm -rf .buildozer

          rm -rf bin


      # ==========================================================
      # 16. VERIFIER ENVIRONNEMENT
      # ==========================================================
      - name: Verifier environnement
        run: |

          echo "===== PYTHON ====="
          python --version

          echo "===== PIP ====="
          python -m pip --version

          echo "===== JAVA ====="
          java -version

          echo "===== BUILDOZER ====="
          buildozer --version


      # ==========================================================
      # 17. RECHERCHER CHARSET_NORMALIZER
      # ==========================================================
      - name: Rechercher toutes les references a charset_normalizer
        working-directory: projet
        run: |

          echo ""
          echo "=========================================================="
          echo " RECHERCHE AUTOMATIQUE CHARSET_NORMALIZER"
          echo "=========================================================="

          echo ""
          echo "=========================================================="
          echo "1. RECHERCHE DANS LE PROJET"
          echo "=========================================================="

          grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=bin \
            --exclude-dir=.buildozer \
            "charset[_-]normalizer" \
            . \
            2>/dev/null \
            || echo "Aucune reference dans le projet."


          echo ""
          echo "=========================================================="
          echo "2. RECHERCHE DANS PYTHON-FOR-ANDROID"
          echo "=========================================================="

          P4A="$HOME/.buildozer/android/platform/python-for-android"

          if [ -d "$P4A" ]; then

            echo "Python-for-Android trouve :"
            echo "$P4A"

            echo ""

            grep -RniE \
              "charset[_-]normalizer" \
              "$P4A" \
              2>/dev/null \
              || echo "Aucune reference dans python-for-android."

          else

            echo "python-for-android n'est pas encore present."

          fi


          echo ""
          echo "=========================================================="
          echo "3. RECHERCHE DANS L'ENVIRONNEMENT BUILD"
          echo "=========================================================="

          BUILD="$HOME/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a"

          if [ -d "$BUILD" ]; then

            echo "Repertoire trouve :"
            echo "$BUILD"

            echo ""

            grep -RniE \
              "charset[_-]normalizer" \
              "$BUILD" \
              2>/dev/null \
              || echo "Aucune reference dans l'environnement de build."

          else

            echo "Le repertoire de build n'existe pas encore."

          fi


          echo ""
          echo "=========================================================="
          echo "4. RECHERCHE DES FICHIERS REQUIREMENTS"
          echo "=========================================================="

          find \
            "$HOME/.buildozer" \
            projet \
            -type f \
            \
              -name "*.txt" \
              -o -name "*.py" \
              -o -name "*.recipe" \
              -o -name "requirements*" \
              -o -name "buildozer.spec" \
            \
            -print \
            2>/dev/null \
          | while read fichier
            do

              if grep -qiE \
                "charset[_-]normalizer" \
                "$fichier" \
                2>/dev/null
              then

                echo ""
                echo "--------------------------------------------------"
                echo "FICHIER : $fichier"
                echo "--------------------------------------------------"

                grep -niE \
                  "charset[_-]normalizer" \
                  "$fichier" \
                  2>/dev/null

              fi

            done


          echo ""
          echo "=========================================================="
          echo "5. RECHERCHE DANS LES METADONNEES PIP"
          echo "=========================================================="

          python -m pip list \
            2>/dev/null \
            | grep -iE \
              "charset|normalizer" \
            || true


          echo ""
          echo "=========================================================="
          echo "6. RECHERCHE DES WHEELS CHARSET"
          echo "=========================================================="

          find \
            "$HOME/.buildozer" \
            -type f \
            \
              -iname "*charset*" \
              -o -iname "*normalizer*" \
            \
            -print \
            2>/dev/null \
            | head -200


          echo ""
          echo "=========================================================="
          echo " FIN DE LA RECHERCHE"
          echo "=========================================================="


      # ==========================================================
      # 18. COMPILER APK
      # ==========================================================
      - name: Compiler APK
        working-directory: projet
        env:
          ACLOCAL_PATH: /usr/share/aclocal:/usr/share/libtool/m4
          LIBTOOLIZE: libtoolize
        run: |

          echo "===== MACROS LIBTOOL ====="

          find /usr/share \
            -name "libtool.m4" \
            -o -name "lt*.m4" \
            2>/dev/null \
            | head -50


          echo "===== ACLOCAL PATH ====="

          echo "$ACLOCAL_PATH"


          echo "===== LIBTOOL ====="

          libtool --version


          echo "===== LIBTOOLIZE ====="

          libtoolize --version


          echo "===== AUTOCONF ====="

          autoconf --version


          echo "===== AUTOMAKE ====="

          automake --version


          echo "===== CONFIGURATION BUILDOZER ====="

          grep -nE \
            "android.api|android.minapi|android.ndk|p4a.branch|p4a.commit|requirements" \
            buildozer.spec


          echo "===== COMPILATION APK ====="

          buildozer -v android debug


      # ==========================================================
      # 19. CHERCHER APK
      # ==========================================================
      - name: Chercher APK
        if: always()
        run: |

          echo "===== APK TROUVES ====="

          find . \
            -type f \
            -name "*.apk" \
            -print

          echo ""
          echo "===== DOSSIER BIN ====="

          ls -lah \
            projet/bin/ \
            || true


      # ==========================================================
      # 20. RECUPERER APK
      # ==========================================================
      - name: Recuperer APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gestion-vente-apk
          path: |
            projet/bin/*.apk
         
