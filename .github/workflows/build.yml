Name: Compilateur APK Kivy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. RÉCUPÉRER LE PROJET
      # ============================================================
      - name: Récupérer le projet
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON HÔTE (Python 3.11)
      # ============================================================
      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. JAVA 17
      # ============================================================
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. DÉPENDANCES LINUX
      # ============================================================
      - name: Installer les dépendances Linux
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            gettext \
            autopoint \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # ============================================================
      # 5. INSTALLER BUILDOZER ET CYTHON STABLES
      # ============================================================
      - name: Installer Buildozer et Cython
        run: |
          python -m pip install --upgrade pip

          pip install buildozer
          pip install "cython<3.1.0"
          pip install legacy-cgi

          echo "=============================================="
          echo "VERSION PYTHON HÔTE"
          echo "=============================================="
          python --version

          echo "=============================================="
          echo "VERSION CYTHON"
          echo "=============================================="
          cython --version

          echo "=============================================="
          echo "VERSION BUILDOZER"
          echo "=============================================="
          buildozer --version


      # ============================================================
      # 6. DÉCOMPRESSER LE PROJET & PURGER LES DÉCHETS DU ZIP
      # ============================================================
      - name: Décompresser le projet et purger le ZIP
        run: |
          mkdir -p projet

          unzip -o sql_stock.zip -d projet

          # SUPPRESSION FORCEE des dossiers cachés corrompus venus du ZIP
          find projet -name ".buildozer" -type d -exec rm -rf {} +
          find projet -name ".bin" -type d -exec rm -rf {} +


      # ============================================================
      # 7. CRÉER BUILDOZER.SPEC
      # ============================================================
      - name: Créer buildozer.spec
        working-directory: projet
        run: |
          buildozer init


      # ============================================================
      # 8. CONFIGURER BUILDOZER
      # ============================================================
      - name: Configurer Buildozer
        working-directory: projet
        run: |

          # --------------------------------------------------------
          # APPLICATION
          # --------------------------------------------------------
          sed -i 's/^title = .*/title = Gestion Vente/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = gestionvente/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.gestion/' buildozer.spec


          # --------------------------------------------------------
          # DÉPENDANCES (Python 3.11 obligatoire dans l'APK)
          # --------------------------------------------------------
          sed -i 's/^requirements = .*/requirements = python3==3.11.0,kivy/' buildozer.spec


          # --------------------------------------------------------
          # ORIENTATION & FICHIERS
          # --------------------------------------------------------
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,jpeg,kv,atlas,db,ttf,txt/' buildozer.spec


          # --------------------------------------------------------
          # API ANDROID ET NDK (Versions ultra-stables)
          # --------------------------------------------------------
          if grep -q '^android.api =' buildozer.spec; then
            sed -i 's/^android.api = .*/android.api = 33/' buildozer.spec
          else
            echo "android.api = 33" >> buildozer.spec
          fi

          if grep -q '^android.minapi =' buildozer.spec; then
            sed -i 's/^android.minapi = .*/android.minapi = 24/' buildozer.spec
          else
            echo "android.minapi = 24" >> buildozer.spec
          fi

          if grep -q '^android.ndk =' buildozer.spec; then
            sed -i 's/^android.ndk = .*/android.ndk = 25b/' buildozer.spec
          else
            echo "android.ndk = 25b" >> buildozer.spec
          fi


          # --------------------------------------------------------
          # NETTOYAGE P4A
          # --------------------------------------------------------
          sed -i '/^p4a.url =/d' buildozer.spec
          sed -i '/^p4a.fork =/d' buildozer.spec
          sed -i '/^p4a.branch =/d' buildozer.spec
          sed -i '/^p4a.commit =/d' buildozer.spec


          # --------------------------------------------------------
          # LOGS
          # --------------------------------------------------------
          if grep -q '^log_level =' buildozer.spec; then
            sed -i 's/^log_level = .*/log_level = 2/' buildozer.spec
          else
            echo "log_level = 2" >> buildozer.spec
          fi


      # ============================================================
      # 9. PRÉPARER LE SDK & FIX SDKMANAGER (CORRECTION ERREUR PATH)
      # ============================================================
      - name: Corriger le chemin sdkmanager et accepter les licences
        run: |
          # 1. Création des répertoires du SDK Android attendus par Buildozer
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/tools/bin"
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          # 2. Création d'un lien symbolique vers le sdkmanager du système
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"
            ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" "$SDK_DIR/tools/bin/avdmanager"
          fi

          # 3. Acceptation automatique des licences SDK
          yes | "$SDK_DIR/tools/bin/sdkmanager" --licenses || true

          # 4. Génération des clés de licences
          mkdir -p "$SDK_DIR/licenses"
          echo -e "\n89330d222637a000b01f7e9f4a3f656c78f4382f\nd56f5187479451eabf01fb78af6dfcb131a6481e\n2433373577d3e887a181e5a4af937d15d0433c50" > "$SDK_DIR/licenses/android-sdk-license"
          echo -e "\n84831b94fe1430d75d55046884d77649db190779" > "$SDK_DIR/licenses/android-sdk-preview-license"


      # ============================================================
      # 10. COMPILATION APK
      # ============================================================
      - name: Compiler APK
        working-directory: projet
        env:
          ACLOCAL_PATH: /usr/share/aclocal:/usr/share/libtool/m4
          LIBTOOLIZE: libtoolize
        run: |

          echo "================================================="
          echo "DÉBUT DE LA COMPILATION APK"
          echo "================================================="

          buildozer -v android debug


      # ============================================================
      # 11. RÉCUPÉRER L'APK
      # ============================================================
      - name: Récupérer APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gestion-vente-apk
          path: projet/bin/*.apk
          if-no-files-found: error
          
