name: Compiler APK Kivy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # PROJET
      # ============================================================

      - name: Recuperer le projet
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"


      # ============================================================
      # JAVA
      # ============================================================

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # DEPENDANCES LINUX
      # ============================================================

      - name: Installer les dependances Linux
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            gettext \
            autopoint \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # ============================================================
      # BUILDOZER
      # ============================================================

      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip

          pip install \
            git+https://github.com/kivy/buildozer.git

          pip install legacy-cgi

          pip install \
            "cython==0.29.34"

          buildozer --version


      # ============================================================
      # DECOMPRESSER LE PROJET
      # ============================================================

      - name: Decompresser le projet
        run: |
          mkdir projet
          unzip sql_stock.zip -d projet


      # ============================================================
      # BUILDOZER SPEC
      # ============================================================

      - name: Creer buildozer.spec
        working-directory: projet
        run: |
          buildozer init


      # ============================================================
      # CONFIGURATION
      # ============================================================

      - name: Configurer Buildozer
        working-directory: projet
        run: |

          sed -i \
            's/^title = .*/title = Gestion Vente/' \
            buildozer.spec

          sed -i \
            's/^package.name = .*/package.name = gestionvente/' \
            buildozer.spec

          sed -i \
            's/^package.domain = .*/package.domain = org.gestion/' \
            buildozer.spec

          sed -i \
            's/^requirements = .*/requirements = python3,kivy/' \
            buildozer.spec

          sed -i \
            's/^orientation = .*/orientation = portrait/' \
            buildozer.spec

          sed -i \
            's/^source.include_exts = .*/source.include_exts = py,png,jpg,jpeg,kv,atlas,db,ttf,txt/' \
            buildozer.spec


          # API Android

          if grep -q '^android.api =' buildozer.spec; then
            sed -i \
              's/^android.api = .*/android.api = 35/' \
              buildozer.spec
          else
            echo "android.api = 35" >> buildozer.spec
          fi


          # API minimum

          if grep -q '^android.minapi =' buildozer.spec; then
            sed -i \
              's/^android.minapi = .*/android.minapi = 24/' \
              buildozer.spec
          else
            echo "android.minapi = 24" >> buildozer.spec
          fi


          # NDK

          if grep -q '^android.ndk =' buildozer.spec; then
            sed -i \
              's/^android.ndk = .*/android.ndk = 28c/' \
              buildozer.spec
          else
            echo "android.ndk = 28c" >> buildozer.spec
          fi


          # ========================================================
          # PYTHON-FOR-ANDROID RECENT
          # ========================================================

          if grep -q '^p4a.branch =' buildozer.spec; then
            sed -i \
              's/^p4a.branch = .*/p4a.branch = develop/' \
              buildozer.spec
          else
            echo "p4a.branch = develop" >> buildozer.spec
          fi


          # Ne PAS utiliser l'ancien commit d2ee8c5.
          #
          # Le develop récent contient les corrections
          # concernant le venv/pip de p4a.

          if grep -q '^p4a.commit =' buildozer.spec; then
            sed -i \
              's/^p4a.commit = .*/p4a.commit = HEAD/' \
              buildozer.spec
          else
            echo "p4a.commit = HEAD" >> buildozer.spec
          fi


          # Niveau de log

          if grep -q '^log_level =' buildozer.spec; then
            sed -i \
              's/^log_level = .*/log_level = 2/' \
              buildozer.spec
          else
            echo "log_level = 2" >> buildozer.spec
          fi


      # ============================================================
      # VERIFICATION
      # ============================================================

      - name: Verifier configuration
        working-directory: projet
        run: |

          echo "=============================================="
          echo "CONFIGURATION BUILDOZER"
          echo "=============================================="

          grep -nE \
            "title|package.name|package.domain|requirements|orientation|android.api|android.minapi|android.ndk|p4a.branch|p4a.commit|log_level" \
            buildozer.spec


      # ============================================================
      # NETTOYAGE
      # ============================================================

      - name: Nettoyer les anciens fichiers
        working-directory: projet
        run: |

          rm -rf .buildozer
          rm -rf bin


      # ============================================================
      # COMPILATION
      # ============================================================

      - name: Compiler APK
        working-directory: projet
        env:
          ACLOCAL_PATH: /usr/share/aclocal:/usr/share/libtool/m4
          LIBTOOLIZE: libtoolize
        run: |

          echo "=============================================="
          echo "COMPILATION APK"
          echo "=============================================="

          buildozer -v android debug


      # ============================================================
      # CHERCHER APK
      # ============================================================

      - name: Chercher APK
        if: always()
        run: |

          echo "=============================================="
          echo "APK TROUVES"
          echo "=============================================="

          find . \
            -type f \
            -name "*.apk" \
            -print

          echo ""

          echo "=============================================="
          echo "DOSSIER BIN"
          echo "=============================================="

          ls -lah projet/bin/ || true


      # ============================================================
      # RECUPERER APK
      # ============================================================

      - name: Recuperer APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gestion-vente-apk
          path: projet/bin/*.apk
          if-no-files-found: error
