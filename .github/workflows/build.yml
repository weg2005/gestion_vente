name: Compiler APK Kivy

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev automake

      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.34"

      - name: Decompresser le projet
        run: |
          mkdir projet
          unzip sql_stock.zip -d projet

      - name: Afficher le contenu
        run: |
          find projet -maxdepth 2 -type f

      - name: Compiler
        working-directory: projet
        run: |
          buildozer -v android debug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: gestion-vente-apk
          path: projet/bin/*.apk
