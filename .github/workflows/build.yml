name: Compiler APK Kivy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # 1. RECUPERER LE PROJET
      # =========================================================
      - name: Recuperer le projet
        uses: actions/checkout@v4


      # =========================================================
      # 2. INSTALLER PYTHON
      # =========================================================
      # python-for-android develop fonctionne maintenant avec
      # Python 3.14.
      # =========================================================
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"


      # =========================================================
      # 3. INSTALLER JAVA
      # =========================================================
      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 4. OUTILS LINUX
      # =========================================================
      - name: Installer les outils Linux
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            gettext \
            autopoint \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # =========================================================
      # 5. VERIFIER AUTOTOOLS
      # =========================================================
      - name: Verifier les outils Autotools
        run: |
          echo "===== AUTOCONF ====="
          autoconf --version

          echo "===== AUTOMAKE ====="
          automake --version

          echo "===== LIBTOOL ====="
          libtool --version

          echo "===== LIBTOOLIZE ====="
          libtoolize --version

          echo "===== LIBTOOL.M4 ====="
          find /usr -name "libtool.m4" 2>/dev/null || true


      # =========================================================
      # 6. CONFIGURER ANDROID SDK
      # =========================================================
      - name: Configurer Android SDK
        run: |

          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"


      # =========================================================
      # 7. VERIFIER ANDROID SDK
      # =========================================================
      - name: Verifier Android SDK
        run: |

          echo "===== PLATFORMS ====="

          find "$ANDROID_HOME/platforms" \
            -maxdepth 1 \
            -type d \
            -print

          echo "===== AIDL ====="

          find "$ANDROID_HOME" \
            -name aidl \
            -type f \
            -print

          echo "===== BUILD TOOLS ====="

          find "$ANDROID_HOME/build-tools" \
            -maxdepth 1 \
            -type d \
            -print


      # =========================================================
      # 8. INSTALLER BUILDOZER
      # =========================================================
      # On utilise la version actuelle de Buildozer depuis GitHub,
      # recommandée pour le fonctionnement avec p4a develop.
      # =========================================================
      - name: Installer Buildozer
        run: |

          python -m pip install --upgrade pip

          pip install \
            git+https://github.com/kivy/buildozer.git

          pip install legacy-cgi

          pip install setuptools

          pip install "cython==0.29.34"

          buildozer --version


      # =========================================================
      # 9. DECOMPRESSER LE PROJET
      # =========================================================
      - name: Decompresser le projet
        run: |

          mkdir projet

          unzip sql_stock.zip -d projet


      # =========================================================
      # 10. AFFICHER LE PROJET
      # =========================================================
      - name: Afficher le projet
        run: |

          echo "===== CONTENU DU PROJET ====="

          find projet \
            -maxdepth 2 \
            -type f \
            -print


      # =========================================================
      # 11. CREER BUILDOZER.SPEC
      # =========================================================
      - name: Creer buildozer.spec
        working-directory: projet
        run: |

          buildozer init


      # =========================================================
      # 12. CONFIGURER BUILDOZER
      # =========================================================
      - name: Configurer Buildozer
        working-directory: projet
        run: |

          # -----------------------------------------------------
          # Informations générales
          # -----------------------------------------------------

          sed -i \
            's/^title = .*/title = Gestion Vente/' \
            buildozer.spec

          sed -i \
            's/^package.name = .*/package.name = gestionvente/' \
            buildozer.spec

          sed -i \
            's/^package.domain = .*/package.domain = org.gestion/' \
            buildozer.spec


          # -----------------------------------------------------
          # Extensions incluses dans l'APK
          # -----------------------------------------------------

          sed -i \
            's/^source.include_exts = .*/source.include_exts = py,png,jpg,jpeg,kv,atlas,db,ttf,txt/' \
            buildozer.spec


          # -----------------------------------------------------
          # Dépendances Python
          # -----------------------------------------------------

          sed -i \
            's/^requirements = .*/requirements = python3,kivy/' \
            buildozer.spec


          # -----------------------------------------------------
          # Orientation
          # -----------------------------------------------------

          sed -i \
            's/^orientation = .*/orientation = portrait/' \
            buildozer.spec


          # -----------------------------------------------------
          # Android API
          # -----------------------------------------------------

          if grep -q '^android.api =' buildozer.spec
          then
            sed -i \
              's/^android.api = .*/android.api = 35/' \
              buildozer.spec
          else
            echo "android.api = 35" >> buildozer.spec
          fi


          # -----------------------------------------------------
          # Android minimum API
          # -----------------------------------------------------

          if grep -q '^android.minapi =' buildozer.spec
          then
            sed -i \
              's/^android.minapi = .*/android.minapi = 24/' \
              buildozer.spec
          else
            echo "android.minapi = 24" >> buildozer.spec
          fi


          # -----------------------------------------------------
          # SDK Android
          # -----------------------------------------------------

          if grep -q '^android.sdk_path =' buildozer.spec
          then
            sed -i \
              "s|^android.sdk_path = .*|android.sdk_path = $ANDROID_HOME|" \
              buildozer.spec
          else
            echo "android.sdk_path = $ANDROID_HOME" >> buildozer.spec
          fi


          # -----------------------------------------------------
          # NDK
          # -----------------------------------------------------
          # On laisse Buildozer utiliser son NDK préparé.
          # -----------------------------------------------------

          if grep -q '^android.ndk =' buildozer.spec
          then
            sed -i \
              's/^android.ndk = .*/android.ndk = 28c/' \
              buildozer.spec
          else
            echo "android.ndk = 28c" >> buildozer.spec
          fi


          # -----------------------------------------------------
          # PYTHON-FOR-ANDROID
          # -----------------------------------------------------
          #
          # CORRECTIF DE L'ERREUR :
          #
          # ImportError:
          # cannot import name BuildDependencyInstallError
          #
          # On force le commit qui contient le correctif.
          # -----------------------------------------------------

          if grep -q '^p4a.branch =' buildozer.spec
          then
            sed -i \
              's/^p4a.branch = .*/p4a.branch = develop/' \
              buildozer.spec
          else
            echo "p4a.branch = develop" >> buildozer.spec
          fi


          if grep -q '^p4a.commit =' buildozer.spec
          then
            sed -i \
              's/^p4a.commit = .*/p4a.commit = d2ee8c5/' \
              buildozer.spec
          else
            echo "p4a.commit = d2ee8c5" >> buildozer.spec
          fi


          # -----------------------------------------------------
          # Niveau des logs
          # -----------------------------------------------------

          if grep -q '^log_level =' buildozer.spec
          then
            sed -i \
              's/^log_level = .*/log_level = 2/' \
              buildozer.spec
          else
            echo "log_level = 2" >> buildozer.spec
          fi


      # =========================================================
      # 13. AFFICHER LA CONFIGURATION
      # =========================================================
      - name: Verifier configuration Buildozer
        working-directory: projet
        run: |

          echo "======================================"
          echo "CONFIGURATION BUILDOZER"
          echo "======================================"

          grep -nE \
            "title|package.name|package.domain|requirements|orientation|android.api|android.minapi|android.ndk|p4a.branch|p4a.commit|android.sdk_path|log_level" \
            buildozer.spec


      # =========================================================
      # 14. PREPARER LE SDK BUILDOZER
      # =========================================================
      # Buildozer cherche encore l'ancien chemin :
      #
      # ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
      #
      # On crée donc les anciens chemins vers le sdkmanager
      # moderne de GitHub Actions.
      # =========================================================
      - name: Preparer le SDK Buildozer
        run: |

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "SDK Buildozer : $SDK"


          # -----------------------------------------------------
          # Créer les anciens répertoires attendus
          # -----------------------------------------------------

          mkdir -p "$SDK"

          mkdir -p "$SDK/tools/bin"


          # -----------------------------------------------------
          # Relier sdkmanager
          # -----------------------------------------------------

          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"


          # -----------------------------------------------------
          # Relier avdmanager
          # -----------------------------------------------------

          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"


          # -----------------------------------------------------
          # Vérifier sdkmanager
          # -----------------------------------------------------

          "$SDK/tools/bin/sdkmanager" --version


          # -----------------------------------------------------
          # Accepter les licences
          # -----------------------------------------------------

          yes | "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses || true


          # -----------------------------------------------------
          # Installer les plateformes nécessaires
          # -----------------------------------------------------

          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-35" \
            "build-tools;37.0.0"


          # -----------------------------------------------------
          # Vérification
          # -----------------------------------------------------

          echo "===== PLATEFORMES BUILDOZER ====="

          find "$SDK/platforms" \
            -maxdepth 1 \
            -type d \
            -print

          echo "===== BUILD TOOLS BUILDOZER ====="

          find "$SDK/build-tools" \
            -maxdepth 1 \
            -type d \
            -print


      # =========================================================
      # 15. NETTOYER UN ANCIEN BUILDOZER
      # =========================================================
      # Très important :
      # on ne veut pas réutiliser l'ancien python-for-android
      # qui a provoqué l'erreur pip.
      # =========================================================
      - name: Nettoyer ancien environnement Buildozer
        working-directory: projet
        run: |

          echo "Suppression de l'ancien environnement Buildozer..."

          rm -rf .buildozer

          rm -rf bin

          echo "Nettoyage terminé."


      # =========================================================
      # 16. VERIFIER PIP / PYTHON
      # =========================================================
      - name: Verifier Python
        run: |

          echo "===== PYTHON ====="

          python --version

          python -m pip --version

          echo "===== JAVA ====="

          java -version

          echo "===== BUILDOZER ====="

          buildozer --version


      # =========================================================
      # 17. COMPILER L'APK
      # =========================================================
      - name: Compiler APK
        working-directory: projet
        env:
          ACLOCAL_PATH: /usr/share/aclocal:/usr/share/libtool/m4
          LIBTOOLIZE: libtoolize
        run: |

          echo "======================================"
          echo "MACROS LIBTOOL"
          echo "======================================"

          find /usr/share \
            -name "libtool.m4" \
            -o -name "lt*.m4" \
            2>/dev/null | head -50


          echo "======================================"
          echo "ACLOCAL PATH"
          echo "======================================"

          echo "$ACLOCAL_PATH"


          echo "======================================"
          echo "LIBTOOL"
          echo "======================================"

          libtool --version

          libtoolize --version


          echo "======================================"
          echo "AUTOCONF"
          echo "======================================"

          autoconf --version


          echo "======================================"
          echo "AUTOMAKE"
          echo "======================================"

          automake --version


          echo "======================================"
          echo "BUILDOZER SPEC"
          echo "======================================"

          grep -nE \
            "android.api|android.minapi|android.ndk|p4a.branch|p4a.commit|requirements" \
            buildozer.spec


          echo "======================================"
          echo "COMPILATION APK"
          echo "======================================"

          buildozer -v android debug


      # =========================================================
      # 18. CHERCHER L'APK
      # =========================================================
      - name: Chercher APK
        if: always()
        run: |

          echo "======================================"
          echo "APK TROUVEES"
          echo "======================================"

          find . \
            -type f \
            -name "*.apk" \
            -print


          echo "======================================"
          echo "DOSSIER BIN"
          echo "======================================"

          ls -lah projet/bin/ || true


      # =========================================================
      # 19. RECUPERER L'APK
      # =========================================================
      - name: Recuperer APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gestion-vente-apk
          path: |
            projet/bin/*.apk
          if-no-files-found: error
