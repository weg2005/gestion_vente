name: Compiler APK Kivy

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer les outils Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake

      - name: Configurer Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROIDSDK=$ANDROID_HOME" >> $GITHUB_ENV

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/35.0.0" >> $GITHUB_PATH

      - name: Verifier Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Verification AIDL :"
          find "$ANDROID_HOME" -name aidl -type f
          echo "Verification build-tools :"
          ls -la "$ANDROID_HOME/build-tools/35.0.0"

      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.34"

      - name: Decompresser le projet
        run: |
          mkdir projet
          unzip sql_stock.zip -d projet

      - name: Afficher le projet
        run: |
          find projet -maxdepth 2 -type f

      - name: Creer buildozer.spec
        working-directory: projet
        run: |
          buildozer init

      - name: Configurer Buildozer
        working-directory: projet
        run: |
          sed -i 's/^title = .*/title = Gestion Vente/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = gestionvente/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.gestion/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,jpeg,kv,atlas,db,ttf,txt/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy/' buildozer.spec
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec

          echo "android.sdk_path = $ANDROID_HOME" >> buildozer.spec

          echo "===== BUILDОZER.SPEC ====="
          cat buildozer.spec

      - name: Compiler APK
        working-directory: projet
        run: |
          buildozer -v android debug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: gestion-vente-apk
          path: projet/bin/*.apk
