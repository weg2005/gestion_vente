name: Compilateur APK Kivy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # 1. RÉCUPÉRER LE PROJET
      # ============================================================
      - name: Récupérer le projet
        uses: actions/checkout@v4

      # ============================================================
      # 2. PYTHON HÔTE (3.11 est la version la plus stable pour P4A)
      # ============================================================
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. JAVA (JDK 17 requis)
      # ============================================================
      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 4. DÉPENDANCES LINUX
      # ============================================================
      - name: Installer les dépendances Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            gettext \
            autopoint \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      # ============================================================
      # 5. INSTALLER BUILDOZER & CYTHON COMPATIBLE
      # ============================================================
      - name: Installer Buildozer et Cython
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.1.0"
          pip install buildozer
          pip install legacy-cgi
          buildozer --version

      # ============================================================
      # 6. DÉCOMPRESSER LE PROJET
      # ============================================================
      - name: Décompresser le projet
        run: |
          mkdir -p projet
          unzip -o sql_stock.zip -d projet

      # ============================================================
      # 7. CRÉER ET CONFIGURER BUILDOZER.SPEC
      # ============================================================
      - name: Configurer Buildozer
        working-directory: projet
        run: |
          buildozer init

          # Application
          sed -i 's/^title = .*/title = Gestion Vente/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = gestionvente/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.gestion/' buildozer.spec

          # Dépendances de base
          sed -i 's/^requirements = .*/requirements = python3,kivy/' buildozer.spec

          # Orientation et extensions
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,jpeg,kv,atlas,db,ttf,txt/' buildozer.spec

          # Versions stables Android (API 33 / NDK 25b)
          if grep -q '^android.api =' buildozer.spec; then
            sed -i 's/^android.api = .*/android.api = 33/' buildozer.spec
          else
            echo "android.api = 33" >> buildozer.spec
          fi

          if grep -q '^android.minapi =' buildozer.spec; then
            sed -i 's/^android.minapi = .*/android.minapi = 24/' buildozer.spec
          else
            echo "android.minapi = 24" >> buildozer.spec
          fi

          if grep -q '^android.ndk =' buildozer.spec; then
            sed -i 's/^android.ndk = .*/android.ndk = 25b/' buildozer.spec
          else
            echo "android.ndk = 25b" >> buildozer.spec
          fi

          # Nettoyage des branches instables P4A
          sed -i '/^p4a.branch =/d' buildozer.spec
          sed -i '/^p4a.commit =/d' buildozer.spec

          # Logs détaillés
          if grep -q '^log_level =' buildozer.spec; then
            sed -i 's/^log_level = .*/log_level = 2/' buildozer.spec
          else
            echo "log_level = 2" >> buildozer.spec
          fi

      # ============================================================
      # 8. COMPILATION APK
      # ============================================================
      - name: Compiler APK
        working-directory: projet
        env:
          ACLOCAL_PATH: /usr/share/aclocal:/usr/share/libtool/m4
          LIBTOOLIZE: libtoolize
        run: |
          buildozer -v android debug

      # ============================================================
      # 9. RÉCUPÉRER L'APK
      # ============================================================
      - name: Récupérer APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gestion-vente-apk
          path: projet/bin/*.apk
          if-no-files-found: error
          
