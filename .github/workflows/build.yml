name: Compiler APK Kivy

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer les outils Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake

      - name: Configurer Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"

      - name: Verifier Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "===== AIDL DISPONIBLES ====="
          find "$ANDROID_HOME" -name aidl -type f

          echo "===== PLATEFORMES ANDROID ====="
          ls -la "$ANDROID_HOME/platforms"

          echo "===== BUILD TOOLS ====="
          ls -la "$ANDROID_HOME/build-tools"

      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.34"

      - name: Decompresser le projet
        run: |
          mkdir projet
          unzip sql_stock.zip -d projet

      - name: Afficher le projet
        run: |
          echo "===== FICHIERS DU PROJET ====="
          find projet -maxdepth 2 -type f

      - name: Creer buildozer.spec
        working-directory: projet
        run: |
          buildozer init

      - name: Configurer Buildozer
        working-directory: projet
        run: |

          echo "===== CONFIGURATION BUILDOZER ====="

          sed -i 's/^title = .*/title = Gestion Vente/' buildozer.spec

          sed -i 's/^package.name = .*/package.name = gestionvente/' buildozer.spec

          sed -i 's/^package.domain = .*/package.domain = org.gestion/' buildozer.spec

          sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,jpeg,kv,atlas,db,ttf,txt/' buildozer.spec

          sed -i 's/^requirements = .*/requirements = python3,kivy/' buildozer.spec

          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec

          # CORRECTION IMPORTANTE :
          # Remplacer l'API 33 créée par buildozer init
          # par l'API 35 installée dans le SDK.

          if grep -q '^android.api =' buildozer.spec; then
            sed -i 's/^android.api = .*/android.api = 35/' buildozer.spec
          else
            echo "android.api = 35" >> buildozer.spec
          fi

          if grep -q '^android.minapi =' buildozer.spec; then
            sed -i 's/^android.minapi = .*/android.minapi = 24/' buildozer.spec
          else
            echo "android.minapi = 24" >> buildozer.spec
          fi

          if grep -q '^android.sdk_path =' buildozer.spec; then
            sed -i "s|^android.sdk_path = .*|android.sdk_path = $ANDROID_HOME|" buildozer.spec
          else
            echo "android.sdk_path = $ANDROID_HOME" >> buildozer.spec
          fi

          if grep -q '^log_level =' buildozer.spec; then
            sed -i 's/^log_level = .*/log_level = 2/' buildozer.spec
          else
            echo "log_level = 2" >> buildozer.spec
          fi

          echo ""
          echo "===== VERIFICATION API ====="
          grep -n "android.api" buildozer.spec
          grep -n "android.minapi" buildozer.spec
          grep -n "android.sdk_path" buildozer.spec
          grep -n "log_level" buildozer.spec

          echo ""
          echo "===== BUILDOZER.SPEC COMPLET ====="
          cat buildozer.spec

      - name: Preparer le SDK Buildozer
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "===== CREATION DU SDK BUILDOZER ====="

          mkdir -p "$SDK"
          mkdir -p "$SDK/tools/bin"

          echo "===== CREATION DES LIENS SDKMANAGER ====="

          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"

          echo "===== VERIFICATION SDKMANAGER ====="

          ls -l "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version

          echo "===== ACCEPTATION DES LICENCES ====="

          yes | "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses || true

          echo "===== INSTALLATION API 35 ====="

          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          echo "===== VERIFICATION API 35 ====="

          ls -la "$SDK/platforms"

          echo "===== VERIFICATION BUILD TOOLS ====="

          ls -la "$SDK/build-tools/37.0.0"

          echo "===== VERIFICATION AIDL ====="

          find "$SDK" -name aidl -type f -print

      - name: Compiler APK
        working-directory: projet
        run: |
          echo "========================================"
          echo "        DEBUT COMPILATION APK"
          echo "========================================"

          echo ""
          echo "===== API CONFIGUREE ====="
          grep -n "android.api" buildozer.spec

          echo ""
          echo "===== LANCEMENT BUILDOZER ====="

          buildozer -v android debug

      - name: Chercher APK
        run: |
          echo "========================================"
          echo "          RECHERCHE DES APK"
          echo "========================================"

          find . -type f -name "*.apk" -print

          echo ""
          echo "===== CONTENU DE PROJET/BIN ====="

          ls -lah projet/bin/ || true

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: gestion-vente-apk
          path: '**/*.apk'
          if-no-files-found: error
